system_id: a2_random_only_s43
role: A2_ABLATION_SEED43_VERIFICATION
description: "Seed 43 robustness replicate of the A2 random-only LoRA run."

model:
  base: lightonai/GTE-ModernColBERT-v1
  library: pylate
  max_query_length: 64
  max_doc_length: 8192

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.1

training:
  data:
    triples_path: data/train/dochop_qa_triples_t02.jsonl
    use_section_prefix: false
    hard_neg_threshold: 0.02
    hard_neg_top_k: 0
    random_neg_k: 3
  loss: contrastive_random_only
  optimizer: adamw
  learning_rate: 3.0e-5
  warmup_steps: 200
  num_epochs: 3
  per_device_batch_size: 8
  gradient_accumulation_steps: 4
  seed: 43

eval:
  primary_split: n500_mixed
  query_ids: data/eval/query_ids_500.json
  top_k: 20
  metrics: [section_recall_at_5, doc_recall_at_5, section_recall_at_10]

hardware:
  target_gpu: rtx_4090_24gb
  mixed_precision: bf16

output:
  dir: runs/a2_random_only_s43/
  save_lora_adapter: true
