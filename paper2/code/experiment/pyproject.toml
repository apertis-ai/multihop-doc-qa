[project]
name = "stali"
version = "0.1.0"
description = "Section-Type-Aware Late-Interaction Retrieval (STALI) — Paper 2 codebase"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
  "torch>=2.3.0",
  "transformers>=4.46.0",        # ModernBERT landed in 4.46
  "pylate>=1.1.0",                # LightOn PyLate framework for ColBERT training/serving
  "peft>=0.13.0",                 # LoRA adapters
  "sentence-transformers>=3.2.0",
  "datasets>=2.21.0",
  "accelerate>=0.34.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.8.0",
  "numpy>=1.26",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "spacy>=3.7",
  "rank-bm25>=0.2.2",             # Paper 1 BM25 baseline reuse
  "tqdm>=4.66",
  "openai>=1.40",                 # for end-task judge (gpt-5.4-mini, cached)
  "tenacity>=9.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "ipython>=8.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
